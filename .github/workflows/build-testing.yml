name: stable
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "50 2 * * *" # 2:50am-ish UTC everyday (approx 45 minutes after akmods images run)
  workflow_dispatch:

jobs:
  build-stable:
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    with:
      target: server
      variant: hci
      configuration: nvidia
      tag: testing
